name: Show ONCI Brand Identity

on:
  push:
    paths:
      - scripts/show-brand-identity.py
      - .github/workflows/show-brand-identity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply identity showcase
        run: python scripts/show-brand-identity.py

      - name: Remove migration files
        run: git rm scripts/show-brand-identity.py .github/workflows/show-brand-identity.yml

      - name: Commit changes
        run: |
          git config user.name "Itamar TC Jr"
          git config user.email "48915453+itamartcjr@users.noreply.github.com"
          git add apps/docs/src/BrandBook.tsx apps/docs/src/brand-assets.css
          git commit -m "brand: show official identity in Brand Book intro"
          git push

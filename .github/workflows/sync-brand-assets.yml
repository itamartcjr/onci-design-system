name: Sync Official ONCI Brand Assets

on:
  push:
    paths:
      - scripts/sync-brand-assets.py
      - .github/workflows/sync-brand-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Apply Brand Book synchronization
        run: python scripts/sync-brand-assets.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run check

      - name: Build documentation
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit synchronized Brand Book
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/brand-book.md apps/docs/public/brand/README.md apps/docs/src/BrandBook.tsx apps/docs/src/brand-assets.css
          git commit -m "brand: synchronize official logo across Brand Book"
          git push

name: Fix 1797 Portuguese glyph rendering

on:
  push:
    branches:
      - main
    paths:
      - scripts/fix-1797-portuguese.py
      - .github/workflows/fix-1797-portuguese.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Apply font mapping and Unicode normalization
        run: python scripts/fix-1797-portuguese.py

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: TypeScript check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: render Portuguese glyphs with complete 1797 variants"
          git push

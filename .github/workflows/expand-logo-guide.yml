name: Expand ONCI Logo Guide

on:
  push:
    paths:
      - scripts/expand-logo-guide.py
      - .github/workflows/expand-logo-guide.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply logo guide
        run: python scripts/expand-logo-guide.py

      - name: Remove migration files
        run: git rm scripts/expand-logo-guide.py .github/workflows/expand-logo-guide.yml

      - name: Commit logo guide
        run: |
          git config user.name "Itamar TC Jr"
          git config user.email "48915453+itamartcjr@users.noreply.github.com"
          git add apps/docs/src/BrandBook.tsx apps/docs/src/LogoGuide.tsx apps/docs/src/brand-assets.css docs/brand-book.md apps/docs/public/brand/README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "brand: document complete ONCI logo usage rules"
            git push
          fi

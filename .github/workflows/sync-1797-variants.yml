name: Apply ONCI 1797 typography migration

on:
  push:
    paths:
      - scripts/sync-1797-variants.py
      - .github/workflows/sync-1797-variants.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply typography migration
        run: python scripts/sync-1797-variants.py

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: TypeScript check
        run: npm run check

      - name: Build documentation
        run: npm run build

      - name: Remove temporary migration files
        run: |
          rm scripts/sync-1797-variants.py
          rm .github/workflows/sync-1797-variants.yml

      - name: Commit synchronized typography
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "brand: organize 1797 as one family with variants"
          git push

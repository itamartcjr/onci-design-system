name: Use repository 1797 fonts

on:
  push:
    branches:
      - main
    paths:
      - scripts/use-repository-1797-fonts.py
      - .github/workflows/use-repository-1797-fonts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Apply typography migration
        run: python scripts/use-repository-1797-fonts.py

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: TypeScript check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Commit validated typography integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "typography: load official 1797 assets from repository"
          git push
